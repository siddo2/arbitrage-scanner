<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>⚡ Arbitrage Scanner</title>
  <style>
    :root {
      --bg: #0d1117;
      --bg2: #161b22;
      --bg3: #21262d;
      --border: #30363d;
      --text: #e6edf3;
      --text2: #8b949e;
      --green: #00ff88;
      --green-dim: #238636;
      --yellow: #f0e05a;
      --cyan: #39d0d8;
      --red: #f85149;
      --blue: #58a6ff;
      --purple: #bc8cff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, monospace; font-size: 13px; }

    /* HEADER */
    header {
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo { font-size: 18px; font-weight: 700; color: var(--green); white-space: nowrap; }
    .header-stats { display: flex; gap: 16px; flex-wrap: wrap; flex: 1; }
    .stat-chip {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3px 12px;
      font-size: 12px;
      color: var(--text2);
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .stat-chip .val { color: var(--text); font-weight: 600; }
    .pulse { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
    .pulse.fetching { animation: blink 0.8s infinite; background: var(--yellow); }
    .pulse.error { background: var(--red); }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

    /* EXCHANGE STATUS */
    .exchange-pills { display: flex; gap: 6px; flex-wrap: wrap; padding: 8px 20px; background: var(--bg); border-bottom: 1px solid var(--border); }
    .ex-pill {
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.15s;
      user-select: none;
    }
    .ex-pill.ok { background: rgba(0,255,136,0.08); border-color: rgba(0,255,136,0.3); color: var(--green); }
    .ex-pill.err { background: rgba(248,81,73,0.08); border-color: rgba(248,81,73,0.3); color: var(--red); }
    .ex-pill.selected { background: var(--green); color: #000; border-color: var(--green); }

    /* FILTERS */
    .filters {
      padding: 12px 20px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
    }
    .filter-group { display: flex; align-items: center; gap: 8px; }
    .filter-group label { color: var(--text2); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
    input[type="range"] { accent-color: var(--green); cursor: pointer; }
    input[type="number"], input[type="text"] {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 10px;
      color: var(--text);
      font-size: 12px;
      width: 110px;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="text"] { width: 160px; }
    input:focus { border-color: var(--green); }
    .filter-val { color: var(--green); font-weight: 700; min-width: 36px; display: inline-block; }
    .btn-reset {
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text2);
      padding: 5px 12px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.15s;
    }
    .btn-reset:hover { border-color: var(--text2); color: var(--text); }

    /* STATS BAR */
    .stats-bar {
      padding: 10px 20px;
      display: flex;
      gap: 20px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .stats-bar .s { font-size: 12px; color: var(--text2); }
    .stats-bar .s span { color: var(--text); font-weight: 600; }
    .best-op { color: var(--yellow) !important; font-weight: 700 !important; }

    /* TABLE */
    .table-wrap { overflow-x: auto; padding: 0 0 40px; }
    table { width: 100%; border-collapse: collapse; min-width: 900px; }
    thead th {
      background: var(--bg2);
      color: var(--text2);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      position: sticky;
      top: 57px;
    }
    thead th:hover { color: var(--text); }
    thead th.sorted { color: var(--green); }
    thead th .sort-arrow { margin-left: 4px; opacity: 0.5; }
    thead th.sorted .sort-arrow { opacity: 1; }
    tbody tr {
      border-bottom: 1px solid rgba(48,54,61,0.5);
      transition: background 0.1s;
    }
    tbody tr:hover { background: rgba(255,255,255,0.03); }
    td { padding: 9px 12px; white-space: nowrap; }
    td.num { font-family: monospace; }
    .rank { color: var(--text2); font-size: 11px; }
    .pair-name { font-weight: 700; color: var(--text); }
    .pair-icon { margin-right: 4px; }
    .exchange-tag {
      display: inline-block;
      padding: 1px 7px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
    }
    .buy-tag { background: rgba(88,166,255,0.1); color: var(--blue); border: 1px solid rgba(88,166,255,0.2); }
    .sell-tag { background: rgba(0,255,136,0.1); color: var(--green); border: 1px solid rgba(0,255,136,0.2); }
    .spread-high { color: var(--yellow); font-weight: 700; }
    .spread-good { color: var(--green); font-weight: 600; }
    .spread-ok { color: var(--cyan); }
    .spread-neg { color: var(--red); }
    .fee-cell { color: var(--red); }
    .vol-na { color: var(--text2); }

    /* LOADING */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px;
      color: var(--text2);
      gap: 12px;
      flex-direction: column;
    }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty { text-align: center; padding: 60px; color: var(--text2); }

    /* TIMER BAR */
    .timer-bar-wrap { position: fixed; bottom: 0; left: 0; right: 0; height: 2px; background: var(--bg3); }
    .timer-bar { height: 2px; background: var(--green); transition: width 1s linear; }

    /* RESPONSIVE */
    @media (max-width: 600px) {
      header { padding: 8px 12px; }
      .filters { padding: 8px 12px; }
      .stats-bar { padding: 8px 12px; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">⚡ ARBITRAGE SCANNER</div>
  <div class="header-stats">
    <div class="stat-chip"><span id="pulse" class="pulse"></span><span id="last-update" class="val">Loading…</span></div>
    <div class="stat-chip">Exchanges: <span id="ex-count" class="val">–</span></div>
    <div class="stat-chip">Pairs: <span id="pair-count" class="val">–</span></div>
    <div class="stat-chip">Fetch: <span id="fetch-time" class="val">–</span></div>
  </div>
</header>

<div class="exchange-pills" id="exchange-pills"></div>

<div class="filters">
  <div class="filter-group">
    <label>Min Spread</label>
    <input type="range" id="min-spread" min="0" max="5" step="0.1" value="0.3" />
    <span class="filter-val"><span id="spread-val">0.3</span>%</span>
  </div>
  <div class="filter-group">
    <label>Min Volume $</label>
    <input type="number" id="min-volume" value="50000" step="10000" min="0" />
  </div>
  <div class="filter-group">
    <label>Search pair</label>
    <input type="text" id="pair-search" placeholder="BTC, ETH, SOL…" />
  </div>
  <button class="btn-reset" onclick="resetFilters()">Reset</button>
</div>

<div class="stats-bar" id="stats-bar">
  <div class="s">Opportunities: <span id="opp-count">–</span></div>
  <div class="s">Avg Spread: <span id="avg-spread">–</span></div>
  <div class="s">Best: <span id="best-opp" class="best-op">–</span></div>
</div>

<div class="table-wrap">
  <div class="loading" id="loading"><div class="spinner"></div><span>Fetching prices from 11 exchanges…</span></div>
  <table id="main-table" style="display:none">
    <thead>
      <tr>
        <th data-col="rank"># <span class="sort-arrow">↕</span></th>
        <th data-col="pair">PAIR <span class="sort-arrow">↕</span></th>
        <th data-col="buy_exchange">BUY ON <span class="sort-arrow">↕</span></th>
        <th data-col="buy_price" class="num">BUY PRICE <span class="sort-arrow">↕</span></th>
        <th data-col="sell_exchange">SELL ON <span class="sort-arrow">↕</span></th>
        <th data-col="sell_price" class="num">SELL PRICE <span class="sort-arrow">↕</span></th>
        <th data-col="spread_brut" class="num sorted">GROSS SPREAD <span class="sort-arrow">↓</span></th>
        <th data-col="spread_net" class="num">NET SPREAD <span class="sort-arrow">↕</span></th>
        <th data-col="fees" class="num">FEES <span class="sort-arrow">↕</span></th>
        <th data-col="volume" class="num">MIN VOLUME <span class="sort-arrow">↕</span></th>
        <th data-col="nb_exchanges" class="num">EX <span class="sort-arrow">↕</span></th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="empty" id="empty-msg" style="display:none">No opportunities found. Try lowering the filters.</div>
</div>

<div class="timer-bar-wrap"><div class="timer-bar" id="timer-bar" style="width:100%"></div></div>

<script>
const REFRESH = 15;
let allOpps = [];
let sortCol = 'spread_brut';
let sortDir = -1;
let selectedExchanges = new Set();
let timerInterval = null;
let refreshTimeout = null;

function formatPrice(p) {
  if (p >= 10000) return p.toLocaleString('en', {minimumFractionDigits:2, maximumFractionDigits:2});
  if (p >= 1) return p.toFixed(4);
  if (p >= 0.001) return p.toFixed(6);
  return p.toFixed(8);
}

function formatSpread(val) {
  const cls = val >= 1.5 ? 'spread-high' : val >= 0.7 ? 'spread-good' : val >= 0 ? 'spread-ok' : 'spread-neg';
  const prefix = val >= 0 ? '+' : '';
  return `<span class="${cls}">${prefix}${val.toFixed(3)}%</span>`;
}

function pairIcon(spread) {
  if (spread >= 1.5) return '🔥';
  if (spread >= 0.8) return '✅';
  return '';
}

function applyFilters() {
  const minSpread = parseFloat(document.getElementById('min-spread').value);
  const minVol = parseFloat(document.getElementById('min-volume').value) || 0;
  const search = document.getElementById('pair-search').value.trim().toUpperCase();

  let filtered = allOpps.filter(op => {
    if (op.spread_brut < minSpread) return false;
    if (op.volume !== null && op.volume < minVol) return false;
    if (selectedExchanges.size > 0) {
      if (!selectedExchanges.has(op.buy_exchange) && !selectedExchanges.has(op.sell_exchange)) return false;
    }
    if (search && !op.pair.toUpperCase().includes(search)) return false;
    return true;
  });

  filtered = filtered.sort((a, b) => {
    let va = a[sortCol] ?? (sortCol === 'rank' ? a._rank : null);
    let vb = b[sortCol] ?? (sortCol === 'rank' ? b._rank : null);
    if (va === null || va === undefined) va = -Infinity;
    if (vb === null || vb === undefined) vb = -Infinity;
    if (typeof va === 'string') return sortDir * va.localeCompare(vb);
    return sortDir * (va - vb);
  });

  renderTable(filtered);
  renderStats(filtered);
}

function renderTable(ops) {
  const loading = document.getElementById('loading');
  const table = document.getElementById('main-table');
  const empty = document.getElementById('empty-msg');
  const tbody = document.getElementById('tbody');

  loading.style.display = 'none';

  if (ops.length === 0) {
    table.style.display = 'none';
    empty.style.display = 'block';
    return;
  }

  table.style.display = 'table';
  empty.style.display = 'none';

  tbody.innerHTML = ops.map((op, i) => `
    <tr>
      <td class="rank">${i + 1}</td>
      <td><span class="pair-icon">${pairIcon(op.spread_brut)}</span><span class="pair-name">${op.pair}</span></td>
      <td><span class="exchange-tag buy-tag">${op.buy_exchange}</span></td>
      <td class="num">${formatPrice(op.buy_price)}</td>
      <td><span class="exchange-tag sell-tag">${op.sell_exchange}</span></td>
      <td class="num">${formatPrice(op.sell_price)}</td>
      <td class="num">${formatSpread(op.spread_brut)}</td>
      <td class="num">${formatSpread(op.spread_net)}</td>
      <td class="num fee-cell">-${op.fees.toFixed(3)}%</td>
      <td class="num ${op.volume === null ? 'vol-na' : ''}">${op.volume_display || (op.volume === null ? 'N/A' : '$'+op.volume.toFixed(0))}</td>
      <td class="num">${op.nb_exchanges}</td>
    </tr>
  `).join('');
}

function renderStats(ops) {
  document.getElementById('opp-count').textContent = ops.length;
  if (ops.length === 0) {
    document.getElementById('avg-spread').textContent = '–';
    document.getElementById('best-opp').textContent = '–';
    return;
  }
  const avg = ops.reduce((s, o) => s + o.spread_brut, 0) / ops.length;
  document.getElementById('avg-spread').textContent = '+' + avg.toFixed(3) + '%';
  const best = ops[0];
  document.getElementById('best-opp').textContent = `${best.pair} +${best.spread_brut.toFixed(3)}% (${best.buy_exchange} → ${best.sell_exchange})`;
}

function renderExchangePills(meta) {
  const container = document.getElementById('exchange-pills');
  const allEx = [...(meta.exchanges_ok || []), ...(meta.exchanges_error || [])];
  container.innerHTML = allEx.map(name => {
    const ok = (meta.exchanges_ok || []).includes(name);
    const sel = selectedExchanges.has(name);
    return `<div class="ex-pill ${sel ? 'selected' : ok ? 'ok' : 'err'}" onclick="toggleExchange('${name}')">${name}</div>`;
  }).join('');
}

function toggleExchange(name) {
  if (selectedExchanges.has(name)) selectedExchanges.delete(name);
  else selectedExchanges.add(name);
  applyFilters();
}

function updateHeader(meta) {
  const pulse = document.getElementById('pulse');
  pulse.className = 'pulse' + (meta.fetching ? ' fetching' : '');
  const lu = meta.last_update ? new Date(meta.last_update + 'Z').toLocaleTimeString() : '–';
  document.getElementById('last-update').textContent = lu;
  const ok = (meta.exchanges_ok || []).length;
  const total = ok + (meta.exchanges_error || []).length;
  document.getElementById('ex-count').textContent = `${ok}/${total}`;
  document.getElementById('pair-count').textContent = (meta.total_pairs || 0).toLocaleString();
  document.getElementById('fetch-time').textContent = meta.elapsed ? meta.elapsed + 's' : '–';
}

function startTimerBar() {
  clearInterval(timerInterval);
  const bar = document.getElementById('timer-bar');
  let elapsed = 0;
  bar.style.transition = 'none';
  bar.style.width = '100%';
  setTimeout(() => {
    bar.style.transition = `width ${REFRESH}s linear`;
    bar.style.width = '0%';
  }, 50);
}

async function fetchData() {
  try {
    const res = await fetch('/api/opportunities');
    const json = await res.json();
    allOpps = (json.opportunities || []).map((op, i) => ({...op, _rank: i+1}));
    updateHeader(json.metadata || {});
    renderExchangePills(json.metadata || {});
    applyFilters();
    startTimerBar();
  } catch(e) {
    console.error('Fetch error:', e);
    document.getElementById('pulse').className = 'pulse error';
  } finally {
    refreshTimeout = setTimeout(fetchData, REFRESH * 1000);
  }
}

function resetFilters() {
  document.getElementById('min-spread').value = 0.3;
  document.getElementById('spread-val').textContent = '0.3';
  document.getElementById('min-volume').value = 50000;
  document.getElementById('pair-search').value = '';
  selectedExchanges.clear();
  document.querySelectorAll('.ex-pill').forEach(p => p.classList.remove('selected'));
  applyFilters();
}

// Sort headers
document.querySelectorAll('thead th[data-col]').forEach(th => {
  th.addEventListener('click', () => {
    const col = th.dataset.col;
    if (sortCol === col) sortDir *= -1;
    else { sortCol = col; sortDir = -1; }
    document.querySelectorAll('thead th').forEach(t => {
      t.classList.remove('sorted');
      const arrow = t.querySelector('.sort-arrow');
      if (arrow) arrow.textContent = '↕';
    });
    th.classList.add('sorted');
    const arrow = th.querySelector('.sort-arrow');
    if (arrow) arrow.textContent = sortDir === -1 ? '↓' : '↑';
    applyFilters();
  });
});

// Filter listeners
document.getElementById('min-spread').addEventListener('input', e => {
  document.getElementById('spread-val').textContent = e.target.value;
  applyFilters();
});
document.getElementById('min-volume').addEventListener('input', applyFilters);
document.getElementById('pair-search').addEventListener('input', applyFilters);

// Start
fetchData();
</script>
</body>
</html>
